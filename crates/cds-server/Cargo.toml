[package]
name = "cds-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CDS Hooks HTTP server bridging hooks to Atrius clinical reasoning (JVM sidecar) and KR/clinical FHIR bases."
readme = "README.md"
keywords = ["cds-hooks", "CDS", "fhir", "atrius"]

[lib]
name = "cds_server"
path = "src/lib.rs"

[[bin]]
name = "cds-server"
path = "src/main.rs"

[features]
default = ["otel"]
# OTLP trace export via helios-observability (requires OTEL_EXPORTER_OTLP_ENDPOINT at runtime).
otel = ["helios-observability/otel"]

[dependencies]
helios-cds-hooks = { path = "../cds-hooks" }
helios-observability = { path = "../observability", version = "0.2.1" }
anyhow = "1"
chrono = { workspace = true }
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"

[[example]]
name = "live_sidecar_roundtrip"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
