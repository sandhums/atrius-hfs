[package]
name = "cds-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Axum HTTP router for CDS Hooks: discovery, service invocation, and feedback."
keywords = ["hl7", "fhir", "cds-hooks", "axum", "clinical-decision-support"]
readme = "README.md"

[features]
default = []
# Enables the `cds-hooks-server` binary; library-only users build without it
binary = [
    "dep:cds-core",
    "dep:clap",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:anyhow",
]

[[bin]]
name = "cds-hooks-server"
path = "src/main.rs"
required-features = ["binary"]

[dependencies]
helios-cds-hooks = { path = "../cds-hooks" }
axum = { version = "0.8", features = ["json"] }
http = "1.0"
serde_json.workspace = true
async-trait = "0.1"
thiserror = "1.0"

cds-core = { path = "../cds-core", optional = true }
clap = { version = "4.0", features = ["derive", "env"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
anyhow = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
axum-test = "18.0"
chrono = { workspace = true, features = ["serde"] }
cds-core = { path = "../cds-core" }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
