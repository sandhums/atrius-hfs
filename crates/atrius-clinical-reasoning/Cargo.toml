[package]
name = "atrius-clinical-reasoning"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/HeliosSoftware/hfs/tree/main/crates/atrius-clinical-reasoning"
rust-version.workspace = true
description = "HTTP façade client for the Atrius JVM clinical-reasoning sidecar (CQL/ELM, CDS orchestration)."
keywords = ["atrius", "hl7", "fhir", "cql", "clinical-decision-support", "clinical-reasoning"]
readme = "README.md"

[lib]
name = "atrius_clinical_reasoning"
path = "src/lib.rs"

[features]
default = ["http-client"]

# Real reqwest-backed client to the CR sidecar (`POST /v1/evaluate/expression`, etc.).
http-client = ["dep:reqwest"]

# Tokio + example binary for a manual live roundtrip against localhost sidecar/HFS/HTS.
integration-demo = ["http-client", "dep:tokio"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"

reqwest = { version = "0.12", features = ["json"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }

[[example]]
name = "live_sidecar_roundtrip"
required-features = ["integration-demo"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
